name: Mozol
options:
  bundleIdPrefix: net.vrizo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 5X3V5CCN2N
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  MozolCore:
    path: MozolCore
targets:
  Mozol:
    type: application
    platform: iOS
    sources:
      - path: Mozol
        excludes:
          - Info.plist
          - Mozol.entitlements
    dependencies:
      - package: MozolCore
    entitlements:
      path: Mozol/Mozol.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains:
          - webcredentials:mozol.vrizo.net
    info:
      path: Mozol/Info.plist
      properties:
        CFBundleDisplayName: MOZOL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [net.vrizo.mozol.refresh]
        NSRemindersFullAccessUsageDescription: MOZOL looks through your reminders for ones that match a language tip, then adds the tip to a reminder or creates a new one.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.vrizo.mozol
        PRODUCT_NAME: Mozol
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  MozolTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MozolTests]
    dependencies:
      - target: Mozol
      - package: MozolCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.vrizo.mozol.tests
        GENERATE_INFOPLIST_FILE: YES
  MozolUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MozolUITests]
    dependencies:
      - target: Mozol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.vrizo.mozol.uitests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mozol
schemes:
  Mozol:
    build:
      targets:
        Mozol: all
        MozolTests: [test]
        MozolUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MozolTests
        - MozolUITests
    archive:
      config: Release
